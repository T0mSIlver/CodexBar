name: mistral-widget-proof
on:
  push:
    branches: [proof/mistral-widget-screens]
  workflow_dispatch:
jobs:
  render:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Render
        run: |
          MISTRAL_WIDGET_PROOF_DIR="$RUNNER_TEMP/proof" CODEXBAR_SUPPRESS_TEST_KEYCHAIN_ACCESS=1 \
            swift test --filter MistralWidgetScreenshotProof
          ls -la "$RUNNER_TEMP/proof"
      - uses: actions/upload-artifact@v4
        with:
          name: mistral-widget-proof
          path: ${{ runner.temp }}/proof
